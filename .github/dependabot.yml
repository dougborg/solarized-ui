version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    # The analytics package stays on the blog's version so these pages send only what the
    # blog's privacy notice lists; it is upgraded by hand, with the blog.
    ignore:
      - dependency-name: "@dougborg/site-analytics"
    groups:
      build-toolchain:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
