[global]
flavor = "gfm"
include = ["*.md", "fonts/**/*.md", ".github/**/*.md"]
# release-please generates CHANGELOG.md.
exclude = ["node_modules", "dist", "site", ".claude", "CHANGELOG.md"]
cache = false

[MD013]
line-length = 0
reflow = true
reflow-mode = "sentence-per-line"
code-blocks = false
tables = false
